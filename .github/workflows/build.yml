name: Build and Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README_zh.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Main MCP Sandbox server image ---
      - name: Build & push mcp-sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Python sandbox runtime image (execution environment) ---
      - name: Build & push python-sandbox runtime
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox_images
          file: ./sandbox_images/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-python:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-python:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
