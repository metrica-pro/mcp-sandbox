[server]
host = "0.0.0.0"
port = 8181

[auth]
require_auth = false
default_user_id = "root"
user_sandbox_limit = 3

[docker]
# Pull sandbox runtime image from GHCR (pre-built by CI, not built at runtime)
default_image = "ghcr.io/metrica-pro/mcp-sandbox-python:latest"
dockerfile_path = "sandbox_images/Dockerfile"
check_dockerfile_changes = false
build_info_file = ".docker_build_info"

[logging]
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_file = "mcp_sandbox.log"

[mirror]
pypi_index_url = "https://pypi.org/simple/"